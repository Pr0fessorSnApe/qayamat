apiVersion: v1
kind: Service
metadata:
  name: qayamat-api
  namespace: qayamat
spec:
  selector:
    app: qayamat-core
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: qayamat-redis
  namespace: qayamat
spec:
  selector:
    app: qayamat-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: qayamat-postgres
  namespace: qayamat
spec:
  selector:
    app: qayamat-postgres
  ports:
  - port: 5432
    targetPort: 5432
